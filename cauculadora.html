<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem vindo a calculadora automática</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #333;
    }

    label {
      display: inline-block;
      margin: 10px 0;
      font-size: 16px;
    }

    input, select {
      padding: 8px;
      margin: 10px;
      font-size: 16px;
    }

    button {
      background-color: red;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 20px;
    }

    button:hover {
      background-color: darkred;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>
  <h1>Bem vindo a calculadora automática</h1>

  <p>
    Digite um número:
    <input type="number" id="num1">
  </p>

  <p>
    Digite outro número:
    <input type="number" id="num2">
  </p>

  <p>
    Escolha a operação:
    <select id="operacao">
      <option value="soma">Soma</option>
      <option value="subtracao">Subtração</option>
      <option value="multiplicacao">Multiplicação</option>
      <option value="divisao">Divisão</option>
      <option value="porcentagem">Porcentagem</option>
    </select>
  </p>

  <button onclick="calcular()">Calcular</button>

  <p id="resultado"></p>

  <script>
    function calcular() {
      const num1 = parseFloat(document.getElementById("num1").value);
      const num2 = parseFloat(document.getElementById("num2").value);
      const operacao = document.getElementById("operacao").value;
      let resultado;

      if (isNaN(num1) || isNaN(num2)) {
        document.getElementById("resultado").innerText = "Por favor, insira números válidos.";
        return;
      }

      switch (operacao) {
        case "soma":
          resultado = num1 + num2;
          break;
        case "subtracao":
          resultado = num1 - num2;
          break;
        case "multiplicacao":
          resultado = num1 * num2;
          break;
        case "divisao":
          if (num2 !== 0) {
            resultado = num1 / num2;
          } else {
            resultado = "Erro: não é possível dividir por zero!";
          }
          break;
        case "porcentagem":
          resultado = (num1 * num2) / 100;
          break;
        default:
          resultado = "Escolha uma operação válida.";
      }

      document.getElementById("resultado").innerText = "Resultado: " + resultado;
    }
  </script>
</body>
</html>
